<body><aside class="sidebar"><div class="brand"><span class="logo">IM</span><span>Influencer<br>Marketing AIOS</span></div><nav id="navigation" aria-label="主导航"></nav></aside>
<div class="shell"><header><span>Agent &amp; Prompt</span><span class="muted">本地配置</span></header><main>
<div class="titlebar"><div><h1>Agent 与prompt管理</h1></div></div>
<div class="main-tabs" role="tablist" aria-label="管理类型"><button id="tab-agents" role="tab" aria-selected="true" aria-controls="agent-view" class="selected">Agent 管理</button><button id="tab-prompts" role="tab" aria-selected="false" aria-controls="prompt-view">prompt管理</button></div>
<section id="agent-view" role="tabpanel" aria-labelledby="tab-agents">
 <div id="agent-list-view">
  <div class="section-caption"><span id="agent-count"></span></div>
  <div id="agent-list" class="agent-list"></div>
 </div>
 <div id="agent-detail" hidden>
  <div class="detail-heading"><div><div class="heading-line"><h2 id="agent-title"></h2><span id="agent-state" class="badge"></span></div><p id="agent-subtitle" class="muted"></p></div><button id="back-agents" class="back-link">‹ 返回 Agent 列表</button></div>
  <div id="agent-error" class="error" role="alert"></div>
  <div class="panel agent-panel"><div id="agent-sections" class="section-tabs" role="tablist" aria-label="Agent 配置分类"></div><div id="agent-content" class="agent-content"></div></div>
 </div>
</section>
<section id="prompt-view" role="tabpanel" aria-labelledby="tab-prompts" hidden>
<div id="modules" class="modules" aria-label="配置模块"></div>
<div class="workspace"><section class="panel"><div class="panelhead list-tools"><h2>功能场景 <span id="count" class="muted"></span></h2></div><div id="list" class="list"></div></section>
<section class="panel"><div class="panelhead"><div class="editor-title"><h2 id="name"></h2></div><p id="location" class="muted"></p></div><div class="panelbody editor">
<div id="shared-source" class="shared-source" hidden></div>
<details id="common-bindings" class="common-bindings" hidden><summary>关联功能场景 <span id="binding-count" class="muted"></span></summary><p class="muted">勾选需要共用此提示词的场景，发布后生效。取消关联后使用该场景原有配置。</p><div id="binding-groups"></div></details>
<label for="role">角色设定</label><textarea id="role" rows="3"></textarea>
<label for="rules">规则</label><div class="muted">定义任务、分析规则与业务资料。</div><textarea id="rules" rows="12" style="margin-top:10px"></textarea>

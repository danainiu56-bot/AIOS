odules{display:flex;gap:10px;margin:18px 0}.module{min-width:180px;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 17px}.module small{display:block;margin-top:4px;opacity:.75}.module b{font-size:23px;font-weight:500}.workspace{display:grid;grid-template-columns:225px minmax(320px,1fr) minmax(340px,1fr);align-items:start;gap:16px}.panel{background:white;border:1px solid #dfe7f3;border-radius:16px;overflow:hidden}.panelhead{padding:18px;border-bottom:1px solid #edf1f7}.panelbody{padding:18px}.list-tools{display:grid;gap:8px}.list-tools input,.list-tools select{width:100%}.list{max-height:690px;overflow:auto;padding:8px}.item{display:block;text-align:left;width:100%;border:0;border-radius:10px;margin-bottom:3px;padding:12px;line-height:1.5}.item.selected{background:#edf2ff;color:#2457f5;box-shadow:inset 3px 0 #2457f5}.item small{display:block;margin-top:6px;color:#8a97ab}.item.selected small{color:#7288b5}.editor-title{display:flex;justify-content:space-between;gap:8px;align-items:center}.editor label{display:block;font-weight:600;margin:18px 0 7px}.editor label:first-child{margin-top:0}.editor textarea{font-size:13px;background:#fbfcff}.vars{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.vars button{font-size:11px;padding:5px 7px;color:#2457f5;background:#f5f8ff}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.options select{width:100%}.actions{display:flex;gap:8px;align-items:center;padding:14px 18px;border-top:1px solid #edf1f7;background:#fcfdff;position:sticky;bottom:0}.actions #save-state{margin-right:auto}.preview{position:sticky;top:16px}.preview select{width:100%;margin-top:12px}.preview-tabs{display:flex;gap:5px;margin-top:14px}.preview-tabs button{padding:7px 10px;font-size:12px}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:13px;font-family:inherit;margin:0;max-height:540px;overflow:auto}.preview .output{background:#f7f9fe;border:1px solid #e6ecf7;border-radius:12px;padding:18px;margin-top:12px}.preview textarea{font:12px/1.6 monospace;min-height:350px}.preview-note{color:#8593a8;font-size:12px;line-height:1.7}.error{color:#b94b57;background:#fff1f2;border-radius:9px;padding:12px;white-space:pre-line;font-size:12px;margin:12px 0}.error:empty{display:none}#status{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#263b60;color:white;border-radius:12px;padding:12px 20px;z-index:20;box-shadow:0 8px 35px #203a6026}#status:empty{display:none}dialog{width:min(780px,94vw);max-height:85dvh;border:1px solid #dce4f2;border-radius:18px;padding:0;color:#253147}dialog::backdrop{background:#24314d55;backdrop-filter:blur(3px)}.dialoghead{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid #e5ebf4}.version{border:1px solid #e1e8f3;border-radius:12px;margin-bottom:12px;padding:15px}.version-header{display:flex;justify-content:space-between;gap:12px;align-items:center}.version pre{white-space:pre-wrap;font:12px/1.8 monospace;background:#f7f9fe;padding:14px;border-radius:9px}.version details{margin-top:12px}.compare-title{font-size:12px;color:#648375;margin:14px 0 8px}.empty{padding:24px;color:#8a97ab}.testdata-actions{display:flex;gap:8px;margin-top:10px}[hidden]{display:none!important}
@media(min-width:1700px){.workspace{grid-template-columns:250px minmax(450px,1fr) minmax(430px,1fr)}}@media(max-width:1150px){.sidebar{width:170px}.shell{margin-left:170px}main{padding:18px}.workspace{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.workspace>.panel:first-child{grid-column:1 / -1;display:flex}.list-tools{width:210px;flex-shrink:0;padding:12px}.list{display:flex;flex:1;overflow:auto;max-height:155px;gap:6px;align-items:center}.item{min-width:140px;width:140px}.preview{grid-column:auto;position:sticky;top:12px}.panelhead,.panelbody{padding:14px}.editor-title{flex-wrap:wrap}.module{min-width:0;flex:1}.titlebar{align-items:flex-start}}@media(max-width:760px){.sidebar{position:static;width:auto;padding:12px}.brand{padding-bottom:8px}.sidebar nav{display:flex;overflow:auto}.sidebar a{white-space:nowrap}.shell{margin:0}header{display:none}.workspace{display:flex;flex-direction:column}.workspace>.panel{width:100%}.list{max-height:190px}.workspace>.panel:first-child{display:block}.list-tools{width:100%}.preview{position:static}.module{padding:10px}.module b{display:none}.module small{font-size:10px}.titlebar{flex-wrap:wrap}}

<body><aside class="sidebar"><div class="brand"><span class="logo">IM</span><span>Influencer<br>Marketing AIOS</span></div><nav id="navigation" aria-label="主导航"></nav></aside>
<div class="shell"><header><span>提示词管理</span><span class="pill">本地交互原型</span></header><main>
<div class="titlebar"><div><h1>提示词管理</h1><p class="intro">按模块维护提示词，随时编辑、预览与对比版本。</p></div><button id="backup">导出配置备份 ↗</button></div>
<div class="notice">当前提供本地配置与示例预览，尚未连接 AI 模型。发布仅保存此浏览器中的配置，业务页面暂不使用这些配置生成内容。</div>
<div id="modules" class="modules" aria-label="配置模块"></div>
<div class="workspace"><section class="panel"><div class="panelhead list-tools"><h2>功能场景 <span id="count" class="muted"></span></h2><input id="search" aria-label="搜索提示词" placeholder="搜索名称或使用位置"><select id="type" aria-label="功能类型"><option value="">全部类型</option><option>总结分析</option><option>评分解释</option><option>信息提取</option><option>内容生成</option></select></div><div id="list" class="list"></div></section>
<section class="panel"><div class="panelhead"><div class="editor-title"><h2 id="name"></h2><button id="history">版本记录</button></div><p id="location" class="muted"></p><span id="version" class="pill"></span></div><div class="panelbody editor">
<label for="role">角色设定</label><textarea id="role" rows="2"></textarea>
<label for="task">任务目标</label><textarea id="task" rows="3"></textarea>
<label for="rules">分析规则</label><textarea id="rules" rows="4"></textarea>
<label for="input">业务输入</label><div class="muted">点击变量插入光标位置；预览时自动替换为测试数据。</div><div id="variables" class="vars"></div><textarea id="input" rows="4"></textarea>
<label for="output">输出要求</label><textarea id="output" rows="3"></textarea>
<div class="options"><div><label for="format">输出格式</label><select id="format"><option value="sections">分段展示</option><option value="bullets">要点列表</option><option value="json">JSON</option></select></div><div><label for="length">内容长度</label><select id="length"><option value="brief">简短</option><option value="standard">标准</option><option value="detailed">详细</option></select></div></div>
<div id="errors" class="error" role="alert"></div></div><div class="actions"><span id="save-state" class="muted"></span><button id="save">保存草稿</button><button class="primary" id="publish">发布配置</button></div></section>
<section class="panel preview"><div class="panelhead"><div class="editor-title"><h2>即时预览</h2><span class="pill">随编辑更新</span></div><select id="scenario" aria-label="测试场景"></select><div class="preview-tabs" role="tablist"><button role="tab" data-tab="example">示例排版</button><button role="tab" data-tab="prompt">完整提示词</button><button role="tab" data-tab="data">测试数据</button></div></div><div class="panelbody">
<div id="preview-content"><p id="preview-note" class="preview-note"></p><div class="output"><pre id="preview-output"></pre></div><p><label><input id="compare" type="checkbox"> 对比当前发布版</label></p><div id="comparison" hidden><div id="compare-title" class="compare-title"></div><div class="output"><pre id="published-output"></pre></div></div><button id="copy">复制完整提示词</button></div>
<div id="data-content" hidden><p class="preview-note">可修改测试资料，验证缺失数据与不同场景。修改只用于当前预览。</p><textarea id="data" aria-label="测试数据 JSON" spellcheck="false"></textarea><div id="data-error" class="error" role="alert"></div><div class="testdata-actions"><button id="reset-data">恢复场景数据</button><button id="apply-data" class="primary">应用测试数据</button></div></div>
</div></section></div></main></div><div id="status" role="status" aria-live="polite"></div>
<dialog id="history-dialog"><div class="dialoghead"><h2>版本记录</h2><button id="close-history" aria-label="关闭版本记录">✕</button></div><div id="history-content" class="panelbody"></div></dialog>
<script src="../prompt-config.js"></script><script src="prompt-manager.js"></script></body></html>
